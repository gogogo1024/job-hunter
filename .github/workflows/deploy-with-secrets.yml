name: Deploy with GitHub Secrets

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - '.github/workflows/deploy-with-secrets.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.10.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Extract AI features (using secrets)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASHBY_JOB_BOARD: ${{ secrets.ASHBY_JOB_BOARD }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pnpm --filter @job-hunter/worker exec tsx src/extract-ai-features.ts

      - name: Sync Ashby data (using secrets)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASHBY_JOB_BOARD: ${{ secrets.ASHBY_JOB_BOARD }}
        run: |
          pnpm --filter @job-hunter/worker exec tsx src/sync-ashby.ts

      - name: Job extraction completed
        if: success()
        run: |
          echo "✅ AI feature extraction and Ashby sync completed"
          echo "Environment: production"
          echo "AI Provider: ${{ secrets.AI_PROVIDER }}"
